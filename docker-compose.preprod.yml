services:
  backend:
    build: ./backend
    restart: always
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=0
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - inloopid_db:/app/instance
    depends_on:
      - redis

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

volumes:
  inloopid_db:
  redis_data:
